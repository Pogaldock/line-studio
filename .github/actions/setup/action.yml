# Shared setup: Python 3.13 + the pinned libraries in a cached virtualenv, and (for tracing) the AI models from their
# official public releases (engine/models/models.txt: exact sha256 checked), cached too. Cache hits make this ~1 min; a cold start ~4 min.
name: setup
inputs:
  models: { default: "true" }
  light: { default: "false" }   # "true": video-only environment (no AI libraries), much smaller cache
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: { python-version: "3.13" }
    - id: venv
      uses: actions/cache@v4
      with: { path: ~/venv, key: "venv-${{ runner.os }}-py313-${{ inputs.light == 'true' && 'light-' || '' }}${{ hashFiles(inputs.light == 'true' && 'engine/requirements-light.txt' || 'engine/requirements.txt') }}" }
    - if: steps.venv.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m venv ~/venv
        ~/venv/bin/pip install -q --upgrade pip
        if [ "${{ inputs.light }}" = "true" ]; then
          ~/venv/bin/pip install -q -r engine/requirements-light.txt
        else
          ~/venv/bin/pip install -q -r engine/requirements.txt
          ~/venv/bin/pip uninstall -y -q opencv-python
          ~/venv/bin/pip install -q --no-deps opencv-python-headless==5.0.0.93
        fi
    - name: ffmpeg on PATH (pinned build bundled in imageio-ffmpeg, cached with the venv; the runner image has none)
      shell: bash
      run: |
        ln -sf "$(ls ~/venv/lib/python3.13/site-packages/imageio_ffmpeg/binaries/ffmpeg-*)" ~/venv/bin/ffmpeg
        echo "$HOME/venv/bin" >> "$GITHUB_PATH"
        ~/venv/bin/ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
    - id: models
      if: inputs.models == 'true'
      uses: actions/cache@v4
      with: { path: "engine/models/dl", key: "models-${{ hashFiles('engine/models/models.txt') }}" }
    - if: inputs.models == 'true' && steps.models.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p engine/models/dl
        grep -v '^#' engine/models/models.txt | while read -r f sum url; do
          curl -fsSL --retry 3 "$url" -o "engine/models/dl/$f"
          echo "$sum  engine/models/dl/$f" | sha256sum -c -
        done
    - if: inputs.models == 'true'
      shell: bash
      run: |
        for f in engine/models/dl/*; do case "$f" in *isnet-general-use.onnx) ;; *) ln -sf "$PWD/$f" engine/models/ ;; esac; done
        mkdir -p ~/.rembg/models/isnet-general-use && ln -sf "$PWD/engine/models/dl/isnet-general-use.onnx" ~/.rembg/models/isnet-general-use/
        echo "U2NET_HOME=$HOME/.rembg" >> "$GITHUB_ENV"
