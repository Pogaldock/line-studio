# Chosen option -> captioned 30 s video (video_<option>.mp4 on release job-<id>). Started by the phone page.
# Planned time: light setup ~15 s; with the pre-rendered master only the caption (+ comment) pass (~15 s), otherwise
# a master render (~40 s on 4 cores) then that pass. Limit 15 min.
name: render
run-name: render ${{ inputs.job }} ${{ inputs.option }} ${{ inputs.rid }}
on:
  workflow_dispatch:
    inputs:
      job: { required: true }
      option: { required: true }
      caption: { required: false, default: "" }
      seconds: { required: false, default: "26" }
      ink: { required: false, default: "1" }
      comment: { required: false, default: "" }
      cstyle: { required: false, default: "" }
      rid: { required: false, default: "" }
permissions: { contents: write }
concurrency: { group: "render-${{ inputs.job }}-${{ inputs.option }}-${{ inputs.rid }}", cancel-in-progress: true }
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: { GH_TOKEN: "${{ github.token }}", LS_KEY: "${{ secrets.LS_KEY }}", TAG: "job-${{ inputs.job }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { models: "false", light: "true" }
      - name: get chosen drawing (and its pre-rendered master, when there is one for this speed)
        env: { OPT: "${{ inputs.option }}", SECONDS_: "${{ inputs.seconds }}", INK: "${{ inputs.ink }}" }
        run: |
          gh release download "$TAG" -p "opt_${OPT}.tgz.enc" -D work
          M=$(python3 -c "import sys;print(f'raw_{sys.argv[1]}_{float(sys.argv[2]):g}_{float(sys.argv[3]):g}.mp4.enc')" "$OPT" "$SECONDS_" "$INK")
          gh release download "$TAG" -p "$M" -D work || echo "no pre-rendered master ($M): full render"
      - name: get the comment crop (optional)
        if: inputs.comment != ''
        env: { COMMENT: "${{ inputs.comment }}" }
        run: |
          [[ "$COMMENT" =~ ^comment_[a-z0-9]{1,12}\.png\.enc$ ]] || { echo "bad comment name"; exit 1; }
          gh release download "$TAG" -p "$COMMENT" -D work
      - name: render video
        env: { CAPTION: "${{ inputs.caption }}", SECONDS_: "${{ inputs.seconds }}", OPT: "${{ inputs.option }}", INK: "${{ inputs.ink }}", COMMENT: "${{ inputs.comment }}", CSTYLE: "${{ inputs.cstyle }}", RID: "${{ inputs.rid }}" }
        run: ~/venv/bin/python engine/studio.py render work "$OPT" "$CAPTION" --seconds "$SECONDS_" --ink "$INK" --comment "$COMMENT" --cstyle "$CSTYLE" --rid "$RID" --tag "$TAG"
      - name: report failure
        if: failure()
        env: { P: "progress_render_${{ inputs.option }}${{ inputs.rid != '' && '_' || '' }}${{ inputs.rid }}.json" }
        run: |
          mkdir -p work; test -f "work/$P" && grep -q '"failed"' "work/$P" || \
            echo '{"kind":"render","stage":"failed","pct":0,"done":true,"error":"runner setup failed: see the Actions log"}' > "work/$P"
          gh release upload "$TAG" "work/$P" --clobber
