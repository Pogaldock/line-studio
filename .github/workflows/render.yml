# Chosen option -> captioned 30 s video (video_<option>.mp4 on release job-<id>). Started by the phone page.
# Planned time: light setup ~15 s; with the pre-rendered master only the caption pass (~15 s), otherwise a full
# render (~40 s on 4 cores). Limit 15 min.
name: render
run-name: render ${{ inputs.job }} ${{ inputs.option }}
on:
  workflow_dispatch:
    inputs:
      job: { required: true }
      option: { required: true }
      caption: { required: false, default: "" }
      seconds: { required: false, default: "26" }
permissions: { contents: write }
concurrency: { group: "render-${{ inputs.job }}-${{ inputs.option }}", cancel-in-progress: true }
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: { GH_TOKEN: "${{ github.token }}", LS_KEY: "${{ secrets.LS_KEY }}", TAG: "job-${{ inputs.job }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { models: "false", light: "true" }
      - name: get chosen drawing (and its pre-rendered master, when there is one for this speed)
        env: { OPT: "${{ inputs.option }}", SECONDS_: "${{ inputs.seconds }}" }
        run: |
          gh release download "$TAG" -p "opt_${OPT}.tgz.enc" -D work
          S=$(python3 -c "import sys;print(f'{float(sys.argv[1]):g}')" "$SECONDS_")
          gh release download "$TAG" -p "raw_${OPT}_${S}.mp4.enc" -D work || echo "no pre-rendered master: full render"
      - name: render video
        env: { CAPTION: "${{ inputs.caption }}", SECONDS_: "${{ inputs.seconds }}", OPT: "${{ inputs.option }}" }
        run: ~/venv/bin/python engine/studio.py render work "$OPT" "$CAPTION" --seconds "$SECONDS_" --tag "$TAG"
      - name: report failure
        if: failure()
        run: |
          mkdir -p work; test -f "work/progress_render_${{ inputs.option }}.json" && grep -q '"failed"' "work/progress_render_${{ inputs.option }}.json" || \
            echo '{"kind":"render","stage":"failed","pct":0,"done":true,"error":"runner setup failed: see the Actions log"}' > "work/progress_render_${{ inputs.option }}.json"
          gh release upload "$TAG" "work/progress_render_${{ inputs.option }}.json" --clobber
