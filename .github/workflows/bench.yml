# Timing test for a TikTok LIVE version: profile-picture-sized photos (720 px) traced one after another with the
# models kept loaded (engine/pfpbench.py). Test faces: free-licence Pexels portraits (via the pexels-portrait dataset).
# Planned: setup ~4 min cold, 9 pictures x ~15-25 s, stills ~1 min. Limit 25 min.
name: bench
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { models: "true" }
      - name: test faces (free Pexels portraits, listed by the gaunernst/pexels-portrait dataset), square 720 px like a pfp
        run: |
          mkdir -p faces
          curl -sSf "https://datasets-server.huggingface.co/rows?dataset=gaunernst/pexels-portrait&config=default&split=train&offset=40&length=9" \
            | ~/venv/bin/python -c "import sys,json; [print(r['row']['src']) for r in json.load(sys.stdin)['rows']]" > urls.txt
          i=0; while read u; do curl -sSfL -o faces/f$i.jpg "${u%%\?*}?auto=compress&w=1000"; i=$((i+1)); done < urls.txt
          ~/venv/bin/python - <<'PY'
          import cv2, glob
          for f in sorted(glob.glob('faces/*.jpg')):
              im = cv2.imread(f); assert im is not None, f'{f} is not an image'
              h, w = im.shape[:2]; s = min(h, w); y = int(max(0, min(h - s, 0.38 * h - s / 2))); x = (w - s) // 2
              cv2.imwrite(f, cv2.resize(im[y:y + s, x:x + s], (720, 720), interpolation=cv2.INTER_AREA))
          PY
          ls -la faces
      - name: time the pictures
        run: ~/venv/bin/python -u engine/pfpbench.py out faces/*.jpg
      - name: stills
        run: |
          cd engine; for d in ../out/*/; do n=$(basename $d); f=$(ls ../faces | sed -n "$((10#${n%%_*}+1))p")
            NO916=1 HUMANIZE=1 STILL=1 HU_ARGS="smooth=1.2 drift=0.5 spike=2.5 taper=10 var=0.12" ~/venv/bin/python make916.py ../faces/$f $d ../out/$n.mp4 26 > /dev/null 2>&1; done; ls ../out
      - uses: actions/upload-artifact@v4
        with: { name: bench-stills, path: "out/*_still.png", retention-days: 2 }
