# Line-source test (tools/linesrc.py): job photos through many line extractors, raw maps side by side. The sheet holds
# other people's pictures: uploaded encrypted (LS_KEY) to release "compare" only.
# Planned: setup ~1-4 min, extra libraries ~1 min, weights ~1 min, 10 photos x 10 sources ~5 min. Limit 25 min.
name: linesrc
on:
  workflow_dispatch:
    inputs:
      jobs: { description: "job ids, comma separated", required: true }
permissions: { contents: write }
jobs:
  maps:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: { GH_TOKEN: "${{ github.token }}", LS_KEY: "${{ secrets.LS_KEY }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { models: "true" }
      - run: ~/venv/bin/pip install -q controlnet_aux==0.0.10 && ~/venv/bin/pip install -q --force-reinstall --no-deps opencv-python-headless==5.0.0.93 && ~/venv/bin/pip uninstall -y -q opencv-python || true
      - name: photos
        run: |
          mkdir -p ph; for j in $(echo "${{ inputs.jobs }}" | tr ',' ' '); do gh release download "job-$j" -p photo.jpg.enc -D "in_$j"
            ~/venv/bin/python -c "import sys; sys.path.insert(0,'engine'); import studio; studio.unseal('in_$j/photo.jpg.enc','ph/$j.jpg')"; done
      - name: line maps
        run: ~/venv/bin/python -u tools/linesrc.py linesrc.jpg ph/*.jpg
      - run: ~/venv/bin/python -c "import sys; sys.path.insert(0,'engine'); import studio; studio.upload_private('compare', ['linesrc.jpg'])"
