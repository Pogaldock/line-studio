# Request list: every 10 minutes a light job reads the comments on the account's videos (no AI models, ~30 s); only when
# a request is waiting does the drawing job start (models, ~2 min per request, at most 10 per run).
# engine/requests_scan.py, settings in engine/requests_config.json. State and every image encrypted (release "requests",
# job-<id> releases). Limits: scan 10 min, draw 40 min.
name: requests
run-name: requests${{ inputs.test_account && format(' (test {0})', inputs.test_account) || '' }}${{ inputs.redo && ' (redo)' || '' }}
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
    inputs:
      test_account: { description: "optional: also process this account's picture as a request (end-to-end test)", required: false, default: "" }
      redo: { description: "process every request not marked posted again (after a change to the look)", type: boolean, default: false }
      test_inbox: { description: "optional: test the screenshot inbox (mock screenshot + this typed @name)", required: false, default: "" }
      clean_tests: { description: "remove every entry made by a test run", type: boolean, default: false }
permissions: { contents: write }
concurrency: { group: requests, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs: { pending: "${{ steps.scan.outputs.pending }}" }
    env: { GH_TOKEN: "${{ github.token }}", LS_KEY: "${{ secrets.LS_KEY }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { light: "true", models: "false" }
      - name: state release
        run: gh release view requests > /dev/null 2>&1 || gh release create requests --title requests --prerelease --notes "request list state (encrypted)"
      - id: scan
        name: read comments
        env: { TEST: "${{ inputs.test_account }}", REDO: "${{ inputs.redo && '--redo' || '' }}", TI: "${{ inputs.test_inbox }}", CLEAN: "${{ inputs.clean_tests && '--clean-tests' || '' }}" }
        run: |
          if [ -n "$TI" ]; then
            [[ "$TI" =~ ^[A-Za-z0-9._]{2,30}$ ]] || { echo "bad account name"; exit 1; }
            ~/venv/bin/python -u engine/requests_scan.py --scan-only --test-inbox "$TI"
          elif [ -n "$TEST" ]; then
            [[ "$TEST" =~ ^[A-Za-z0-9._]{2,30}$ ]] || { echo "bad account name"; exit 1; }
            ~/venv/bin/python -u engine/requests_scan.py --scan-only --test "$TEST" "draw me pls"
          else ~/venv/bin/python -u engine/requests_scan.py --scan-only $REDO $CLEAN; fi
  draw:
    needs: scan
    if: needs.scan.outputs.pending != '0' && needs.scan.outputs.pending != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env: { GH_TOKEN: "${{ github.token }}", LS_KEY: "${{ secrets.LS_KEY }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { models: "true" }
      - name: draw the waiting requests
        run: ~/venv/bin/python -u engine/requests_scan.py --process-only
